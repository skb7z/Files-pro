name: Build APK

# Runs ONLY when you press "Run workflow" in the Actions tab.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Make app icons from your logo (icon.png)
        run: |
          pip install pillow numpy
          python3 tools/make_icons.py

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FilesPro-APK
          path: app/build/outputs/apk/release/files-pro.apk
